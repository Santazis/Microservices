global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'user-api'
    static_configs:
      - targets: ['user-api:8080']

  - job_name: 'identity-api'
    static_configs:
      - targets: ['identity-api:8080']

  - job_name: 'gateway-api'
    static_configs:
      - targets: ['gateway-api:8080']

  - job_name: 'catalog-api'
    static_configs:
      - targets: ['catalog.api:8080']

  - job_name: 'imageprocessing-api'
    static_configs:
      - targets: ['imageprocessing.api:8080']

  - job_name: 'basket-api'
    static_configs:
      - targets: ['basket-api:8080']
